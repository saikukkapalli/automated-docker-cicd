services:
  app:
    image: saicowdary9/automated-docker-cicd:sha-1c36e45
    container_name: compose-test-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: compose-test-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - web

networks:
  web:
