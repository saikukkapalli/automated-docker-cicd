services:
  app:
    image: ${DOCKERHUB_USERNAME}/automated-docker-cicd:latest
    container_name: compose-test-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: compose-test-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/sai.pranat.online/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/sai.pranat.online/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - web

networks:
  web:
