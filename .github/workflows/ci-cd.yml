
name: Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/automated-docker-cicd
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-to-ec2:
    name: Deploy HTTPS Stack to AWS EC2
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            set -eu

            cd /home/ubuntu/automated-docker-cicd
            git fetch origin main
            git reset --hard origin/main

            cd compose-ssl-test
            export DOCKERHUB_USERNAME

            sudo --preserve-env=DOCKERHUB_USERNAME docker compose config --quiet
            sudo --preserve-env=DOCKERHUB_USERNAME docker compose pull app
            sudo --preserve-env=DOCKERHUB_USERNAME docker compose up -d --remove-orphans

            sudo docker compose exec -T nginx nginx -t

            curl --fail --silent --show-error \
              --retry 5 --retry-delay 2 \
              https://sai.pranat.online/ \
              --output /dev/null

            echo "HTTPS deployment verified successfully."
